name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bass-effector-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          cmake -S devices/bass-effector -B devices/bass-effector/build -DCMAKE_BUILD_TYPE=Release
          cmake --build devices/bass-effector/build -j
      - name: test
        run: devices/bass-effector/build/native_tests

  bass-effector-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: test
        run: python3 -m unittest discover -s devices/bass-effector/hardware/tests -t devices/bass-effector/hardware -v
